[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoeda"
version = "0.1.0"
description = "Automatic exploratory data analysis and data-quality checks, with suggested fixes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "plotly>=5.20",
    "typer>=0.12",
]

[project.scripts]
autoeda = "autoeda.cli:app"

[project.optional-dependencies]
agent = [
    "langgraph>=0.2",
    "ollama>=0.3",
]
app = [
    "streamlit>=1.35",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autoeda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "-W error" turns every warning into a failure, so pandas deprecation warnings
# are caught the day they appear instead of silently piling up.
addopts = "-ra -W error"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
